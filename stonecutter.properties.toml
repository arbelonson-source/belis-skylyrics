# Settings shared by every Minecraft version, then each version's own. The release version is mod.version.
mod.id = "skylyrics"
mod.archives = "belis-skylyrics"
mod.version = "0.8.0"

deps.fabric_loader = "0.20.1"
deps.dbus_java = "5.2.2"
loomx.loom_version = "1.19-SNAPSHOT"

# mc_compat goes in fabric.mod.json. modmenu is optional; sodium and iris are only for the test game.
# A range must not end in "<1.21.9": Fabric counts the 1.21.9 snapshots and pre-releases as below 1.21.9, and the jar
# crashes there. Use "<=1.21.8" or "~26.1" (ModManifestTest checks this).
# fabric_api_min goes in fabric.mod.json too: the oldest Fabric API with every Fabric API class and member the jar uses
# (checked against Fabric's maven, 2026-11-16), so an older one gets Fabric's "update Fabric API" message instead of a crash.
# 1.21.9 isn't claimed: no Fabric API for it has the world-drawing events the 1.21.10 jar uses.
# Check versions on https://fabricmc.net/develop
["1.21.1"]
mod.mc_compat = "1.21.1"
mod.fabric_api_min = ">=0.101.2"
deps.fabric_api = "0.116.18+1.21.1"
deps.modmenu = "11.0.5"
deps.sodium = "mc1.21.1-0.6.13-fabric"
deps.iris = "1.8.8+1.21.1-fabric"

