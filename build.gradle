plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = project.archives_base_name
}

// The Minecraft version goes in the jar name so the two release jars are told apart
version = "${project.version}+${project.minecraft_version}"

repositories {
	maven {
		name = 'Terraformers'
		url = 'https://maven.terraformersmc.com/releases/'
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content { includeGroup 'maven.modrinth' }
	}
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"skylyrics" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional: adds a config button in Mod Menu when it is installed
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Only in the test game (runClient), to check the lyrics with Sodium + Iris shaders. Not shipped.
	localRuntime "maven.modrinth:sodium:${project.sodium_version}"
	localRuntime "maven.modrinth:iris:${project.iris_version}"
	// Iris bundles these, but the test game needs them on the classpath directly
	localRuntime "org.anarres:jcpp:1.4.14"
	localRuntime "io.github.douira:glsl-transformer:3.0.0-pre3"
	localRuntime "org.antlr:antlr4-runtime:4.13.1"

	// Talks to music players over D-Bus (MPRIS) on Linux. Bundled inside the mod jar.
	clientImplementation "com.github.hypfvieh:dbus-java-core:${project.dbus_java_version}"
	clientImplementation "com.github.hypfvieh:dbus-java-transport-native-unixsocket:${project.dbus_java_version}"
	include "com.github.hypfvieh:dbus-java-core:${project.dbus_java_version}"
	include "com.github.hypfvieh:dbus-java-transport-native-unixsocket:${project.dbus_java_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:5.13.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// runProductionClient: the built jar with the published Fabric API, Sodium, Iris and Mod Menu,
// the way a player installs it. Catches problems that only show up outside the dev game.
configurations {
	productionMods { transitive = false }
}

dependencies {
	productionMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	productionMods "maven.modrinth:sodium:${project.sodium_version}"
	productionMods "maven.modrinth:iris:${project.iris_version}"
	productionMods "com.terraformersmc:modmenu:${project.modmenu_version}"
}

tasks.register("runProductionClient", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	mods.from(jar)
	// -PmodsDir=/path/to/mods tries the jar next to a player's own mod list instead
	if (project.hasProperty("modsDir")) {
		mods.from(fileTree(project.property("modsDir").toString()) { include "*.jar" })
	} else {
		mods.from(configurations.productionMods)
	}
	jvmArgs.add("-Dskylyrics.testHook=true")
	// -PwindowSize=1600x900 sets the game window's size
	if (project.hasProperty("windowSize")) {
		def (w, h) = project.property("windowSize").toString().tokenize("x")
		programArgs.addAll("--width", w, "--height", h)
	}
	// -PquickPlay=WorldName opens that world straight away
	if (project.hasProperty("quickPlay")) {
		programArgs.addAll("--quickPlaySingleplayer", project.property("quickPlay").toString())
	}
	runDir = file("run-prod")
}

sourceSets {
	test {
		compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
		runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
	}
}

test {
	useJUnitPlatform()
	// Name every test in the log, so CI shows that the Windows ones really ran there
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat "full"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}
