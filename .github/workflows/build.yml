# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    # Windows and macOS too: the tests there run the music readers against the real system
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    # A normal build takes under 10 minutes; a stuck runner would otherwise hang for hours
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        # Keeps downloaded libraries between runs, so a slow download server can't fail the build
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: check the music helper tests really ran
        if: matrix.os != 'macos-15'
        # The tests that drive the real PowerShell helper skip themselves when PowerShell isn't found, so check by name
        # that they ran (on Windows also the test of the real Windows media controls). Counting skips broke each time
        # a test with a POSIX stand-in helper (skipped on Windows) was added.
        run: |
          py=$(command -v python3 || command -v python)
          must="talksToTheHelper coversThatHangNeverMakeAPollLate aCoverIsReadAgainAfterAFewSeconds controlsNeverReachAnotherApp"
          if [ "$RUNNER_OS" = "Windows" ]; then must="$must readsTheRealWindowsMediaControls"; fi
          for report in versions/*/build/test-results/test/TEST-dev.beli.skylyrics.media.WindowsMediaSourceTest.xml; do
            grep -o '<testsuite [^>]*>' "$report"
            "$py" - "$report" $must <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          cases = {c.get('name'): c for c in root.iter('testcase')}
          bad = [n for n in sys.argv[2:] if n not in cases or cases[n].find('skipped') is not None]
          broken = [n for n, c in cases.items() if c.find('failure') is not None or c.find('error') is not None]
          if bad or broken:
              print('not run:', bad, 'failed:', broken)
              sys.exit(1)
          PY
          done
      - name: show failed tests as annotations
        # The annotations can be read through GitHub's API, which is easier to reach than the full log
        if: failure()
        run: |
          py=$(command -v python3 || command -v python)
          for f in versions/*/build/test-results/test/*.xml; do
            [ -f "$f" ] || continue
            "$py" - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for case in ET.parse(sys.argv[1]).getroot().iter('testcase'):
              for bad in list(case.findall('failure')) + list(case.findall('error')):
                  text = (bad.get('message') or '') + ' | ' + (bad.text or '')[:1500]
                  text = text.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                  print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
          PY
          done
      - name: capture build artifacts
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
