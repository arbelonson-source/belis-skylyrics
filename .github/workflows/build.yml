# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    # Windows and macOS too: the tests there run the music readers against the real system
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    # A normal build takes under 10 minutes; a stuck runner would otherwise hang for hours
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        # Keeps downloaded libraries between runs, so a slow download server can't fail the build
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: check the music helper tests really ran
        if: matrix.os != 'macos-15'
        # Each system skips exactly one: Linux the real Windows test, Windows the "no Windows media" test.
        # More skips would mean PowerShell wasn't found and the helper went untested.
        run: |
          for report in versions/*/build/test-results/test/TEST-dev.beli.skylyrics.media.WindowsMediaSourceTest.xml; do
            grep -o '<testsuite [^>]*>' "$report"
            grep -q 'skipped="1"' "$report" && grep -q 'failures="0"' "$report" && grep -q 'errors="0"' "$report" || exit 1
          done
      - name: show failed tests as annotations
        # The annotations can be read through GitHub's API, which is easier to reach than the full log
        if: failure()
        run: |
          py=$(command -v python3 || command -v python)
          for f in versions/*/build/test-results/test/*.xml; do
            [ -f "$f" ] || continue
            "$py" - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for case in ET.parse(sys.argv[1]).getroot().iter('testcase'):
              for bad in list(case.findall('failure')) + list(case.findall('error')):
                  text = (bad.get('message') or '') + ' | ' + (bad.text or '')[:1500]
                  text = text.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                  print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
          PY
          done
      - name: capture build artifacts
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
