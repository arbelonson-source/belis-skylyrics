# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    # Windows too: the tests there run the music helper against the real Windows media controls
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: check the music helper tests really ran
        # Each system skips exactly one: Linux the real Windows test, Windows the "no Windows media" test.
        # More skips would mean PowerShell wasn't found and the helper went untested.
        run: |
          report=build/test-results/test/TEST-dev.beli.skylyrics.media.WindowsMediaSourceTest.xml
          grep -o '<testsuite [^>]*>' "$report"
          grep -q 'skipped="1"' "$report" && grep -q 'failures="0"' "$report" && grep -q 'errors="0"' "$report"
      - name: capture build artifacts
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
