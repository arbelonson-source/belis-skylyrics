# Publishes a GitHub release with one jar per Minecraft version (stonecutter.properties.toml), all built
# from main. Two ways to start it:
# - push a tag like v0.2.0, or
# - Actions tab → release → Run workflow (on main): it takes the version from stonecutter.properties.toml,
#   creates the tag on the commit it built, and publishes the release.

name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: build
        run: chmod +x ./gradlew && ./gradlew build
      - name: work out the tag
        run: |
          version=$(sed -n 's/^mod.version = "\(.*\)"$/\1/p' stonecutter.properties.toml)
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but stonecutter.properties.toml says $version"; exit 1; }
          elif gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$version is already released; raise mod.version in stonecutter.properties.toml first"; exit 1
          fi
          echo "TAG=v$version" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jars=$(ls build/libs/*.jar | grep -v -- '-sources.jar$')
          want=$(grep -c '^\["' stonecutter.properties.toml)
          test "$(echo "$jars" | wc -l)" = "$want" || { echo "expected $want jars, got: $jars"; exit 1; }
          notes=".github/release-notes/$TAG.md"
          # --target makes the tag on this commit when it doesn't exist yet (Run workflow)
          if [ -f "$notes" ]; then
            gh release create "$TAG" $jars --target "$GITHUB_SHA" --title "Beli's SkyLyrics $TAG" --notes-file "$notes"
          else
            gh release create "$TAG" $jars --target "$GITHUB_SHA" --title "Beli's SkyLyrics $TAG" --generate-notes
          fi
