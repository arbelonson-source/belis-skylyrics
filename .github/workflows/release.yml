# Publishes a GitHub release with two jars: 1.21.11 (built from main) and 26.2 (built from the
# mc-26.2 branch, which must already have everything main has). Two ways to start it:
# - push a tag like v0.2.0, or
# - Actions tab → release → Run workflow (on main): it takes the version from gradle.properties,
#   creates the tag on the commit it built, and publishes the release.

name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: build
        run: chmod +x ./gradlew && ./gradlew build
      - name: build the 26.2 jar
        run: |
          git fetch origin mc-26.2
          git merge-base --is-ancestor HEAD FETCH_HEAD || { echo "::error::mc-26.2 is missing changes from this commit; merge main into mc-26.2 and push it first"; exit 1; }
          git worktree add "$RUNNER_TEMP/port" FETCH_HEAD
          (cd "$RUNNER_TEMP/port" && chmod +x ./gradlew && ./gradlew build)
          cp "$RUNNER_TEMP"/port/build/libs/*.jar build/libs/
      - name: work out the tag
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2 | tr -d ' ')
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but gradle.properties says $version"; exit 1; }
          elif gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$version is already released; raise the version in gradle.properties first"; exit 1
          fi
          echo "TAG=v$version" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jars=$(ls build/libs/*.jar | grep -v -- '-sources.jar$')
          test "$(echo "$jars" | wc -l)" = 2 || { echo "expected two jars, got: $jars"; exit 1; }
          notes=".github/release-notes/$TAG.md"
          # --target makes the tag on this commit when it doesn't exist yet (Run workflow)
          if [ -f "$notes" ]; then
            gh release create "$TAG" $jars --target "$GITHUB_SHA" --title "Beli's SkyLyrics $TAG" --notes-file "$notes"
          else
            gh release create "$TAG" $jars --target "$GITHUB_SHA" --title "Beli's SkyLyrics $TAG" --generate-notes
          fi
