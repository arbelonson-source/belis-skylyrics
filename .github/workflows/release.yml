# Pushing a tag like v0.1.0 builds the mod and publishes a GitHub release with the jar.

name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: build
        run: chmod +x ./gradlew && ./gradlew build
      - name: check the tag matches the version in gradle.properties
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2 | tr -d ' ')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but gradle.properties says $version"; exit 1; }
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources.jar$')
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" "$jar" --title "Beli's SkyLyrics $GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" "$jar" --title "Beli's SkyLyrics $GITHUB_REF_NAME" --generate-notes
          fi
